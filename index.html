<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麻雀団体管理簿</title>
<meta name="theme-color" content="#1b3a6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: navy (紺) header band with a 点棒 rule, sticky tab bar, single working column (max 1080px) of sections. */
:root{
  --bg:#eef1f5; --surface:#fbfcfe; --surface-2:#e4e9f1; --line:#d2dae6;
  --ink:#141b26; --ink-2:#475366; --muted:#77839a;
  --felt:#1b3a6b; --felt-ink:#eef3fb; --accent:#1f4f9a; --accent-soft:#dbe6f6;
  --neg:#b4352b; --warn:#8a5a00; --ok:#0d6b3c;
  --stick:#f5f1e6; --stick-dot:#c8372d;
  --grid:#e2e6ee; --axis:#b8c2d2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --f-display:var(--f-body);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-num:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --surface:#131a25; --surface-2:#1b2433; --line:#283447;
  --ink:#edf1f7; --ink-2:#b7c2d4; --muted:#8592a8;
  --felt:#14284a; --felt-ink:#e8eef9; --accent:#6f9fe6; --accent-soft:#1a2c4a;
  --neg:#f07f74; --warn:#e3a640; --ok:#5fcf96;
  --stick:#e9e4d6; --stick-dot:#d84b40;
  --grid:#222c3b; --axis:#3a475c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1018; --surface:#131a25; --surface-2:#1b2433; --line:#283447;
  --ink:#edf1f7; --ink-2:#b7c2d4; --muted:#8592a8;
  --felt:#14284a; --felt-ink:#e8eef9; --accent:#6f9fe6; --accent-soft:#1a2c4a;
  --neg:#f07f74; --warn:#e3a640; --ok:#5fcf96;
  --stick:#e9e4d6; --stick-dot:#d84b40;
  --grid:#222c3b; --axis:#3a475c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{background:var(--felt);color:var(--felt-ink)}
.top .wrap{padding-block:18px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px}
.brand{font-family:var(--f-display);font-weight:500;font-size:30px;letter-spacing:.12em;line-height:1.1;margin:0}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;letter-spacing:.08em;opacity:.8;margin-top:4px}
.tenbou{flex:1 1 160px;min-width:120px;height:8px;border-radius:4px;align-self:center;
  background:radial-gradient(circle at 50% 50%,var(--stick-dot) 0 3px,transparent 3.5px),var(--stick);opacity:.9}
.top .meta{font-size:12px;opacity:.85;font-family:var(--f-num)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:12px 14px 10px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab:hover{color:var(--ink)}

#banner .wrap{padding-block:10px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
main.wrap{padding-block:20px 64px;display:grid;gap:28px}
.sec{display:grid;gap:12px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
.note{color:var(--muted);font-size:12.5px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid2>*{min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg)}
.btn.armed{background:var(--neg);border-color:var(--neg);color:var(--surface)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}

input[type=text],input[type=number],input[type=datetime-local],input:not([type]),select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
label.fld{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl tr.sel{background:var(--accent-soft)}
.neg{color:var(--neg)}
.pt-big{font-family:var(--f-num);font-size:18px;font-weight:600}
.rankno{font-family:var(--f-display);font-size:20px;width:36px}
.rank1 .rankno{color:var(--accent)}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;flex:none}
.tname{font-weight:700}
.sub{display:block;color:var(--muted);font-size:12px;font-weight:400}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.04em}
.tag.m3{background:color-mix(in srgb,var(--s2) 18%,var(--surface));}
.tag.m4{background:color-mix(in srgb,var(--s1) 16%,var(--surface));}
.tag.mult{background:var(--accent);color:var(--surface)}

.chart{min-height:280px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chart-in{position:relative}
.chart svg{display:block;max-width:100%}
.tip{position:absolute;top:10px;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgb(0 0 0 / .12);min-width:150px;z-index:2}
.tip b{display:block;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);padding:10px 14px 0}
.legend span{display:inline-flex;align-items:center}
.chart-empty{display:grid;place-items:center;min-height:240px;color:var(--muted);font-size:13px;padding:20px;text-align:center}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile .k{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.tile .v{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.3}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:42px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}

.seat-row{display:grid;grid-template-columns:34px minmax(0,1fr) 130px 76px;gap:8px;align-items:center}
.seat{font-family:var(--f-display);font-size:18px;text-align:center;color:var(--accent)}
.seat-row select,.seat-row input{width:100%}
.seat-row .prev{font-family:var(--f-num);text-align:right;font-size:13px}
@media (max-width:520px){.seat-row{grid-template-columns:30px minmax(0,1fr) 96px}.seat-row .prev{grid-column:2 / 4;text-align:left;font-size:12px;margin-top:-4px}}
.sumline{font-family:var(--f-num);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;display:grid;gap:8px;justify-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--neg)}
.msg.ok{color:var(--ok)}

.game{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.game-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.game-h .when{font-family:var(--f-num);font-size:13px}
.game-h .actions{margin-left:auto}
.game .tbl td{padding:7px 14px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--f-display);font-size:24px;color:var(--accent);display:block;line-height:1}
.hero-empty{display:grid;gap:16px}
.hero-empty p{max-width:62ch;margin:0;color:var(--ink-2)}

.team-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.team-card .hd{display:flex;align-items:center;gap:8px}
.team-card .hd input{flex:1;font-weight:700}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.mpill{font-size:12px;background:var(--surface-2);border-radius:999px;padding:2px 10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:200px;overflow:auto;padding:4px 0}
.checks label{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.rulebox{display:grid;gap:12px}
.uma{display:flex;flex-wrap:wrap;gap:8px}
.uma input{width:76px}
.summary{font-family:var(--f-num);font-size:13px;background:var(--surface-2);border-radius:6px;padding:8px 10px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
#modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:30;display:grid;place-items:center;padding:16px}
#modal .box{background:var(--surface);border-radius:12px;padding:18px;width:min(640px,100%);display:grid;gap:10px;max-height:90vh;overflow:auto}
details summary{cursor:pointer;font-weight:500}
details{font-size:13px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>

<header class="top"><div class="wrap">
  <h1 class="brand">麻雀団体管理簿<small>四麻・三麻 団体戦スコアボード</small></h1>
  <div class="tenbou" aria-hidden="true"></div>
  <div class="meta" id="meta">読み込み中</div>
</div></header>
<nav class="tabs" aria-label="画面切り替え"><div class="wrap" role="tablist">
  <button class="tab" role="tab" data-tab="standings">チーム順位</button>
  <button class="tab" role="tab" data-tab="input">対局入力</button>
  <button class="tab" role="tab" data-tab="history">対局履歴</button>
  <button class="tab" role="tab" data-tab="personal">個人成績</button>
  <button class="tab" role="tab" data-tab="members">メンバー・チーム</button>
  <button class="tab" role="tab" data-tab="rules">ルール</button>
</div></nav>
<div id="banner"></div>
<main id="main" class="wrap"></main>
<div id="toast" hidden></div>
<div id="modal" hidden></div>

<script>
"use strict";
const SEATS=["東","南","西","北"];
const DEFAULT_RULES={
  four:{start:25000,ret:30000,uma:[30,10,-10,-30],tie:"split"},
  three:{start:35000,ret:40000,uma:[20,0,-20],tie:"split"},
  multPersonal:false
};
const PRESETS={
  four:{label:"Mリーグ公式",r:{start:25000,ret:30000,uma:[30,10,-10,-30],tie:"split"}},
  three:{label:"三麻標準（MJ・雀荘式）",r:{start:35000,ret:40000,uma:[20,0,-20],tie:"split"}}
};
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round1=x=>Math.round((x+(x>=0?1e-9:-1e-9))*10)/10;
const LS_KEY="jandan-league-v1";

const S={
  teams:[],members:[],games:[],rules:clone(DEFAULT_RULES),
  got:{teams:false,members:false,games:false},
  tab:"standings",
  mode:{standings:"all",personal:"4",history:"all"},
  sort:{key:"total",dir:-1},
  sel:null,demo:null,backend:null,canWrite:true,
  form:null,assign:null,rulesDraft:null,importing:false
};
const data=()=>S.demo||S;
function rulesOf(mode,D=data()){return mode===3?D.rules.three:D.rules.four}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function newForm(mode=4){return{id:null,mode,playedAt:nowLocal(),rows:Array.from({length:mode},()=>({memberId:"",score:""})),note:"",source:"manual",orig:null,mult:S.lastMult||1}}
S.form=newForm(4);

/* ---------- formatting ---------- */
function fmtPt(v){if(v==null||isNaN(v))return"—";const a=Math.abs(v).toFixed(1);return v>0?"+"+a:v<0?"−"+a:"0.0"}
function ptCell(v){return`<span class="${v<0?"neg":""}">${fmtPt(v)}</span>`}
function fmtScore(v){return Number(v).toLocaleString("ja-JP")}
function fmtWhen(s){return s?s.replace("T"," ").replace(/-/g,"/"):""}
function pct(a,b){return b?(a/b*100).toFixed(1)+"%":"—"}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+"…":s}
function memberById(id,D=data()){return D.members.find(m=>m.id===id)}
function teamById(id,D=data()){return D.teams.find(t=>t.id===id)}
function mName(id){const m=memberById(id);return m?m.account||m.realName:"（削除済み）"}
function teamColor(t){return`var(--s${((t?.color??0)%8)+1})`}
function teamChip(id){const t=teamById(id);return t?`<span class="chip" style="background:${teamColor(t)}"></span>${esc(t.name)}`:`<span class="sub" style="display:inline">無所属</span>`}

/* ---------- scoring ---------- */
function scoreGame(g,D=data()){
  const r=rulesOf(g.mode,D),n=g.mode;
  const oka=(r.ret-r.start)*n/1000;
  const bonus=r.uma.slice(0,n).map((u,i)=>Number(u)+(i===0?oka:0));
  const rows=g.results.map((x,i)=>({...x,seat:x.seat??i}));
  rows.sort((a,b)=>b.score-a.score||a.seat-b.seat);
  const out=[];let i=0;
  while(i<rows.length){
    let j=i;
    if(r.tie==="split")while(j+1<rows.length&&rows[j+1].score===rows[i].score)j++;
    const b=bonus.slice(i,j+1).reduce((s,v)=>s+v,0)/(j-i+1);
    for(let k=i;k<=j;k++)out.push({...rows[k],rank:i+1,tied:j>i,pt:round1((rows[k].score-r.ret)/1000+b)});
    i=j+1;
  }
  return out;
}
function scoredGames(mode="all",D=data()){
  return D.games.filter(g=>mode==="all"||String(g.mode)===String(mode))
    .slice().sort((a,b)=>(a.playedAt||"").localeCompare(b.playedAt||"")||(a.createdAt||0)-(b.createdAt||0))
    .map(g=>{const mult=multFor(g,D);return{g,mult,rows:scoreGame(g,D).map(r=>({...r,mult,wpt:round1(r.pt*mult)}))}});
}
function multFor(g){
  const m=Number(g.mult);return m>0?m:1;
}
function memberStats(mode,D=data()){
  const map=new Map();
  for(const m of D.members)map.set(m.id,blank(m.id));
  function blank(id){return{id,games:0,total:0,ranks:[0,0,0,0],rankSum:0,maxScore:null,tobi:0,pt4:0,pt3:0,n4:0,n3:0}}
  for(const{g,rows}of scoredGames(mode,D))for(const r of rows){
    if(!map.has(r.memberId))map.set(r.memberId,blank(r.memberId));
    const s=map.get(r.memberId);
    const v=D.rules.multPersonal?r.wpt:r.pt;
    s.games++;s.total=round1(s.total+v);s.ranks[r.rank-1]++;s.rankSum+=r.rank;
    if(s.maxScore==null||r.score>s.maxScore)s.maxScore=r.score;
    if(r.score<0)s.tobi++;
    if(g.mode===4){s.pt4=round1(s.pt4+v);s.n4++}else{s.pt3=round1(s.pt3+v);s.n3++}
  }
  const n=mode==="3"?3:4;
  return[...map.values()].map(s=>({...s,avg:s.games?round1(s.total/s.games):null,avgRank:s.games?s.rankSum/s.games:null,
    top:s.games?s.ranks[0]/s.games:null,rentai:s.games?(s.ranks[0]+s.ranks[1])/s.games:null,
    lastAvoid:s.games?1-s.ranks[n-1]/s.games:null}));
}
function teamStandings(mode,D=data()){
  const map=new Map();
  for(const t of D.teams)map.set(t.id,{id:t.id,team:t,total:0,pt4:0,pt3:0,plays:0,games:new Set()});
  for(const{g,rows}of scoredGames(mode,D))for(const r of rows){
    if(!r.teamId)continue;
    if(!map.has(r.teamId))map.set(r.teamId,{id:r.teamId,team:{name:"（解散したチーム）",color:7},total:0,pt4:0,pt3:0,plays:0,games:new Set()});
    const t=map.get(r.teamId);
    t.total=round1(t.total+r.wpt);t.plays++;t.games.add(g.id);
    if(g.mode===4)t.pt4=round1(t.pt4+r.wpt);else t.pt3=round1(t.pt3+r.wpt);
  }
  return[...map.values()].sort((a,b)=>b.total-a.total);
}

/* ---------- backend ---------- */
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({teams:S.teams,members:S.members,games:S.games,rules:S.rules}))}catch(e){}}
function localBackend(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);S.teams=d.teams||[];S.members=d.members||[];S.games=d.games||[];if(d.rules)S.rules=normRules(d.rules)}}catch(e){}
  S.got={teams:true,members:true,games:true};
  return{kind:"local",
    async put(coll,id,obj){
      if(coll==="config"){S.rules=normRules(obj)}else{const arr=S[coll];const i=arr.findIndex(x=>x.id===id);const doc={...obj,id};if(i>=0)arr[i]=doc;else arr.push(doc)}
      persistLocal();render();
    },
    async del(coll,id){S[coll]=S[coll].filter(x=>x.id!==id);persistLocal();render()}
  };
}
function normRules(r){
  const d=clone(DEFAULT_RULES);
  for(const k of["four","three"])if(r&&r[k]){const x=r[k];d[k]={start:Number(x.start)||d[k].start,ret:Number(x.ret)||d[k].ret,uma:(Array.isArray(x.uma)?x.uma:d[k].uma).map(Number),tie:x.tie==="seat"?"seat":"split"}}
  d.multPersonal=!!(r&&r.multPersonal);
  return d;
}
function guard(){
  if(S.demo){toast("デモ表示中は保存できません。上の「デモを終了」を押してください。");return false}
  if(!S.backend){toast("まだ読み込み中です。少し待ってからもう一度押してください。");return false}
  if(!S.canWrite){toast("このページを編集する権限がありません。オーナーに「参加者」以上の共有を頼んでください。");return false}
  return true;
}
async function put(coll,id,obj){
  if(!guard())return false;
  try{await S.backend.put(coll,id,obj);return true}
  catch(e){
    console.error(e);
    toast("保存に失敗しました。もう一度お試しください。");
    return false;
  }
}
async function del(coll,id){
  if(!guard())return false;
  try{await S.backend.del(coll,id);return true}catch(e){toast("削除に失敗しました。もう一度お試しください。");return false}
}

async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=url});
    const sc=Math.min(1,1600/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL("image/jpeg",0.9).split(",")[1];
  }finally{URL.revokeObjectURL(url)}
}

function matchMember(name){
  const D=data();const norm=s=>String(s||"").normalize("NFKC").toLowerCase().replace(/\s+/g,"");
  const n=norm(name);if(!n)return null;
  return D.members.find(m=>norm(m.account)===n)||D.members.find(m=>norm(m.realName)===n)
    ||D.members.find(m=>m.account&&(norm(m.account).includes(n)||n.includes(norm(m.account))))||null;
}
function fillFromPlayers(players,source){
  const n=players.length===3?3:4;
  const f=S.form;const keepId=f.id,keepOrig=f.orig;
  S.form=newForm(n);S.form.id=keepId;S.form.orig=keepOrig;S.form.playedAt=f.playedAt;S.form.note=f.note;S.form.mult=f.mult;S.form.source=source;
  const missing=[];
  players.slice(0,n).forEach((p,i)=>{const m=matchMember(p.name);S.form.rows[i]={memberId:m?m.id:"",score:p.score==null?"":String(p.score)};if(!m)missing.push(p.name)});
  render();
  return missing;
}
function updatePreview(){
  const f=S.form;if(!document.getElementById("sumline"))return;
  const r=rulesOf(f.mode);
  const vals=f.rows.map(x=>parseScore(x.score));
  const ok=vals.every(v=>v!=null);
  const sum=vals.reduce((s,v)=>s+(v||0),0),exp=r.start*f.mode;
  const line=document.getElementById("sumline");
  line.innerHTML=`合計 ${fmtScore(sum)} / ${fmtScore(exp)} 点 ${ok?(sum===exp?`<span style="color:var(--ok)">一致</span>`:`<span style="color:var(--warn)">${sum>exp?"+":"−"}${fmtScore(Math.abs(sum-exp))} 点ずれています（供託の残りなどがなければ入力を確認）</span>`):""}`;
  const mu=multFor(f);
  if(mu!==1)line.innerHTML+=`<br>この対局はチームptが <b>×${mu}</b> になります（下の表示は倍率前のpt）`;
  f.rows.forEach((_,i)=>{const el=document.getElementById("prev"+i);if(el)el.textContent=""});
  if(ok){
    const res=scoreGame({mode:f.mode,results:f.rows.map((x,i)=>({memberId:i,score:vals[i],seat:i}))});
    res.forEach(x=>{const el=document.getElementById("prev"+x.memberId);if(el){el.innerHTML=`${x.rank}位 ${ptCell(x.pt)}`}});

}
function parseScore(s){
  if(s==null)return null;let t=String(s).normalize("NFKC").trim().replace(/[,\s点]/g,"").replace(/^[▲△−–]/,"-");
  if(!/^-?\d+$/.test(t))return null;return parseInt(t,10);
}
async function saveGame(){
  const f=S.form,D=data(),msg=document.getElementById("form-msg");
  const ids=f.rows.map(r=>r.memberId);
  const err=t=>{msg.className="msg err";msg.textContent=t};
  if(ids.some(x=>!x))return err("全員のメンバーを選んでください。");
  if(new Set(ids).size!==ids.length)return err("同じメンバーが2回選ばれています。");
  const vals=f.rows.map(r=>parseScore(r.score));
  if(vals.some(v=>v==null))return err("素点を整数で入れてください（例 32500、マイナスは -4100）。");
  if(!f.playedAt)return err("対局日時を入れてください。");
  const results=f.rows.map((r,i)=>{
    const prev=f.orig&&f.orig.results.find(x=>x.memberId===r.memberId);
    const m=memberById(r.memberId);
    return{memberId:r.memberId,teamId:prev?prev.teamId:(m&&m.teamId&&teamById(m.teamId)?m.teamId:null),score:vals[i],seat:i};
  });
  const id=f.id||uid();
  const doc={mode:f.mode,playedAt:f.playedAt,results,note:f.note||"",source:f.source||"manual",mult:Number(f.mult)>0?Number(f.mult):1,createdAt:f.orig?.createdAt||Date.now()};
  const wasEdit=!!f.id;
  if(await put("games",id,doc)){
    S.form=newForm(f.mode);render();
    toast(wasEdit?"対局を更新しました。":"対局を記録しました。");
  }
}

/* personal */
function viewPersonal(){
  const D=data();if(isEmpty())return viewWelcome();
  const mode=S.mode.personal;const all=mode==="all";
  let st=memberStats(mode);
  const k=S.sort.key,dir=S.sort.dir;
  st.sort((a,b)=>{const av=a[k],bv=b[k];if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return-1;return(av-bv)*dir});
  const cols=all?[["games","対局"],["total","合計pt"],["avg","平均pt"],["pt4","四麻pt"],["pt3","三麻pt"]]
    :[["games","対局"],["total","合計pt"],["avg","平均pt"],["avgRank","平均順位"],["top","トップ率"],["rentai","連対率"],["lastAvoid","ラス回避率"],["maxScore","最高素点"],["tobi","トビ"]];
  const cell=(s,c)=>{const v=s[c];if(v==null)return"—";
    if(["total","avg","pt4","pt3"].includes(c))return ptCell(v);
    if(c==="avgRank")return v.toFixed(2);if(["top","rentai","lastAvoid"].includes(c))return(v*100).toFixed(1)+"%";

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makePlan(){
  const D=data();
  const n=Number(document.getElementById("as-n").value)||2;
  const pick=[...document.querySelectorAll(".as-c:checked")].map(x=>x.value);
  if(pick.length<n){toast(`チーム数（${n}）より多くのメンバーを選んでください。`);return}
  const teams=D.teams.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).slice(0,n);
  const used=new Set(D.teams.map(t=>t.color));
  const plan=teams.map(t=>({teamId:t.id,name:t.name,color:t.color,ids:[]}));
  const letters="ABCDEFGH";let li=0;
  while(plan.length<n){let name;do{name="チーム"+letters[li++]}while(D.teams.some(t=>t.name===name)&&li<8);let c=0;while(used.has(c)&&c<7)c++;used.add(c);plan.push({teamId:null,name,color:c,ids:[]})}
  const order=shuffle(plan.map((_,i)=>i));
  shuffle(pick.slice()).forEach((id,i)=>plan[order[i%n]].ids.push(id));
  S.assign={n,pick,plan};render();
}
async function applyAssign(){
  if(!guard())return;
  const D=data();const plan=S.assign.plan;
  for(const g of plan){
    if(!g.teamId){g.teamId=uid();if(!await put("teams",g.teamId,{name:g.name,color:g.color,createdAt:Date.now()}))return}
  }
  for(const g of plan)for(const id of g.ids){const m=memberById(id);if(m&&m.teamId!==g.teamId){const o={...m,teamId:g.teamId};if(!await put("members",id,o))return}}
  S.assign=null;render();toast("チームの割り振りを確定しました。");
}

/* ---------- charts ---------- */
let charts=[];
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function niceTicks(lo,hi,count){const span=hi-lo;const s0=span/count;const mag=10**Math.floor(Math.log10(s0));const e=s0/mag;const st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st;const t=[];for(let v=a;v<=b+st/2;v+=st)t.push(Math.round(v*1e6)/1e6);return t}
function pickXTicks(n,max){if(n<=1)return[0];const step=Math.max(1,Math.ceil((n-1)/Math.max(1,max)));const t=[];for(let i=0;i<n;i+=step)t.push(i);if(t[t.length-1]!==n-1){if(n-1-t[t.length-1]<step/2)t.pop();t.push(n-1)}return t}
function drawCharts(){

function lineChart(host,cfg){
  const W=Math.max(300,Math.floor(host.clientWidth||640)),H=cfg.height||280;
  const direct=!cfg.single&&cfg.series.length<=4&&W>=520;
  const m={l:50,r:direct?118:16,t:16,b:30};
  const n=cfg.xCount;const vals=cfg.series.flatMap(s=>s.values);
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(hi-lo<1){hi+=10;lo-=10}
  const ticks=niceTicks(lo,hi,5);lo=ticks[0];hi=ticks[ticks.length-1];
  const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const X=i=>m.l+(n<=1?iw/2:i*iw/(n-1)),Y=v=>m.t+(hi-v)*ih/(hi-lo);
  const c={surface:tok("--surface"),grid:tok("--grid"),axis:tok("--axis"),muted:tok("--muted"),ink:tok("--ink-2")};
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" font-size="11" role="img" aria-label="${esc(cfg.label)}">`;
  s+=`<rect width="${W}" height="${H}" fill="${c.surface}"/>`;
  for(const t of ticks){const y=Y(t).toFixed(1);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="${t===0?c.axis:c.grid}" stroke-width="1"/><text x="${m.l-8}" y="${(+y+4).toFixed(1)}" text-anchor="end" fill="${c.muted}">${t>0?"+":""}${t}</text>`}
  for(const i of pickXTicks(n,Math.floor(iw/64)))s+=`<text x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle" fill="${c.muted}">${esc(cfg.xLabel(i))}</text>`;
  for(const se of cfg.series){

    const x=X(i);hov.style.display="";hx.setAttribute("x1",x);hx.setAttribute("x2",x);

function csv(rows){return"﻿"+rows.map(r=>r.map(v=>{const s=String(v??"");return/[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(",")).join("\r\n")}
const p1=v=>v==null?"":(Math.round(v*10)/10).toFixed(1);
function stamp(){return nowLocal().slice(0,10).replace(/-/g,"")}
function saveFile(filename,content,label){
  try{
    const blob=content instanceof Blob?content:new Blob([content],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast(`${label}を保存しました。`);
  }catch(e){
    if(typeof content!=="string"){toast("保存できませんでした。");return}
    showModal(`<h3>${esc(label)}</h3><p class="note">ファイルを保存できなかったため、内容を表示しています。コピーして表計算ソフトに貼り付けてください。</p><textarea id="csvout" rows="12" readonly>${esc(content.replace(/^﻿/,""))}</textarea><div class="actions"><button class="btn primary" data-action="copy-out">コピー</button><button class="btn" data-action="close-modal">閉じる</button></div>`);
  }
}

async function savePng(id){
  const svg=document.querySelector(`#${id} svg`);if(!svg){toast("保存できるグラフがありません。");return}
  const clone_=svg.cloneNode(true);clone_.querySelectorAll(".hov,.hit").forEach(e=>e.remove());

  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone_)],{type:"image/svg+xml"}));
  const img=new Image();
  img.onload=()=>{const cv=document.createElement("canvas");cv.width=W*2;cv.height=H*2;const ctx=cv.getContext("2d");ctx.scale(2,2);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
    cv.toBlob(b=>{if(b)saveFile(`${id==="chart-team"?"チームpt推移":"個人pt推移"}_${stamp()}.png`,b,"グラフ画像")},"image/png")};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("画像に変換できませんでした。")};

/* ---------- screenshot import ---------- */
async function importShot(file){
  const msg=document.getElementById("shot-msg");
  const say=(t,cls="")=>{if(msg){msg.className="msg "+cls;msg.textContent=t}};
  if(S.importing)return;
  const apiKey=getApiKey();
  if(!apiKey){say("スクショ読み取りには Claude APIキーの設定が必要です（「ルール」画面の下）。テキスト貼り付けか手入力もご利用いただけます。","err");return}
  if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){say("PNG・JPEG・WebP の画像を選んでください。","err");return}
  const D=data();const accounts=D.members.map(m=>m.account).filter(Boolean);
  S.importing=true;say("読み取り中…（10〜60秒ほどかかります）");
  const prompt=`この画像は麻雀ゲーム「雀魂（じゃんたま）」の友人戦の終局結果画面のスクリーンショットです。各プレイヤーの表示名と最終持ち点を読み取ってください。
- 上位から順位順に並べる
- score は最終持ち点の整数（例 45200。マイナスは -3400）。「+55.2」のような順位点やptではなく持ち点を使う
- 3人戦なら3件、4人戦なら4件
- 登録済みアカウント名の候補: ${accounts.length?accounts.join(" / "):"（なし）"}
  画面の名前が候補のどれかに一致・ほぼ一致する場合は、候補の表記をそのまま name に入れる
- 結果画面でない、または読めない場合は {"players":[],"error":"理由"} を返す
JSONのみで返答: {"players":[{"name":"アカウント名","score":45200}]}`;
  try{
    const data64=await shrinkImage(file);
    const{default:Anthropic}=await import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.39.0/+esm");
    const client=new Anthropic({apiKey,dangerouslyAllowBrowser:true});
    const msgRes=await client.beta.messages.create({
      model:"claude-opus-5-5",max_tokens:4000,
      betas:["server-side-fallback-2026-07-01"],fallbacks:"default",
      output_config:{effort:"low",format:{type:"json_schema",schema:{type:"object",additionalProperties:false,required:["players"],
        properties:{players:{type:"array",items:{type:"object",additionalProperties:false,required:["name","score"],properties:{name:{type:"string"},score:{type:"integer"}}}},error:{type:"string"}}}}},
      messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:data64}},{type:"text",text:prompt}]}]
    });
    if(msgRes.stop_reason==="refusal"){say("この画像は読み取れませんでした。手入力してください。","err");return}
    const txt=msgRes.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const res=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
    const players=Array.isArray(res?.players)?res.players.map(p=>({name:String(p.name??""),score:parseScore(p.score)})):[];
    if(players.length<3){say(res?.error?`読み取れませんでした：${res.error}`:"プレイヤーを3人以上読み取れませんでした。別の画像を試すか手入力してください。","err");return}
    const miss=fillFromPlayers(players,"screenshot");
    const m2=document.getElementById("shot-msg");
    if(m2){m2.className="msg "+(miss.length?"err":"ok");m2.textContent=miss.length?`読み取りました。登録にない名前があります：${miss.join("、")}。メンバーを選んでください。`:"読み取りました。内容を確認して「記録する」を押してください。"}
  }catch(e){
    console.error(e);
    const st=e&&e.status;
    const t=st===401?"APIキーが正しくありません。「ルール」画面で設定し直してください。"
      :st===402||st===403?"APIキーの残高または権限が足りません。Anthropic Console を確認してください。"
      :st===429||st===529?"Claude API が混み合っています。少し待ってからもう一度お試しください。"
      :st===400?"読み取りに失敗しました（画像が大きすぎる・形式が違う など）。別の画像を試してください。"
      :e instanceof SyntaxError?"読み取り結果を解釈できませんでした。もう一度お試しください。"
      :"読み取りに失敗しました。通信状態を確認してもう一度お試しください。";
    say(t,"err");
  }finally{S.importing=false}
}
function parseText(){
  const t=document.getElementById("paste-text").value;
  const players=[];
  for(const line of t.split(/\r?\n/)){const l=line.normalize("NFKC").trim();if(!l)continue;
    const mm=l.match(/^(?:\d位[\s.:、]*)?(.+?)[\s,:：\t]+([-−▲△]?[\d,]+)\s*点?(?:\s+[-+]?[\d.]+)?$/);
    if(mm)players.push({name:mm[1].trim(),score:parseScore(mm[2])})}
  if(players.length<3||players.length>4){toast("3行か4行の「名前 点数」を入れてください。");return}
  players.sort((a,b)=>b.score-a.score);
  const miss=fillFromPlayers(players,"manual");
  if(miss.length)toast(`登録にない名前：${miss.join("、")}`);
}

/* ---------- demo ---------- */
function makeDemo(){
  const teams=[["東風会",0],["南場組",1],["北家連合",2]].map(([name,color],i)=>({id:"t"+i,name,color,createdAt:i}));
  const names=[["青木 誠","aoki_m"],["石田 葵","aoi.i"],["上野 健","ken_ueno"],["遠藤 遥","haruka"],["小川 拓","taku_o"],["加藤 凛","rin_k"],["木村 翔","sho_kmr"],["工藤 結","yui_k"],["小林 陸","riku"],["斉藤 楓","kaede_s"],["清水 蓮","ren_shimizu"],["鈴木 澪","mio_s"]];
  const members=names.map(([realName,account],i)=>({id:"m"+i,realName,account,teamId:"t"+(i%3),createdAt:i}));
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const games=[];const base=new Date();base.setDate(base.getDate()-40);
  for(let k=0;k<32;k++){
    const mode=k%4===3?3:4;const start=mode===4?25000:35000;
    const ids=shuffle(members.map(m=>m.id)).slice(0,mode);
    const sc=[];let rest=start*mode;
    for(let i=0;i<mode-1;i++){const v=Math.round((start+(rnd()-0.5)*36000)/100)*100;sc.push(v);rest-=v}
    sc.push(rest);
    const d=new Date(base);d.setDate(d.getDate()+Math.floor(k*1.2));d.setHours(20+(k%3),k%2?30:0);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    games.push({id:"g"+k,mode,playedAt:d.toISOString().slice(0,16),results:ids.map((id,i)=>({memberId:id,teamId:members.find(m=>m.id===id).teamId,score:sc[i],seat:i})),note:"",source:"manual",createdAt:k});
  }
  return{teams,members,games,rules:clone(S.rules)};
}

  if(t.id==="shot"&&t.files&&t.files[0]){importShot(t.files[0]);t.value="";return}
  if(!f)return;
  if(f==="member"){S.form.rows[+t.dataset.i].memberId=t.value;return}
  if(f==="rule"&&t.dataset.p==="tie"){S.rulesDraft[t.dataset.k].tie=t.value;return}
  const id=t.dataset.id;
  if(f==="team-name"){const tm=teamById(id);const v=t.value.trim();if(tm&&v&&v!==tm.name)await put("teams",id,{...tm,name:v});return}
  const m=memberById(id);if(!m)return;
  if(f==="m-real"&&t.value.trim()!==m.realName)await put("members",id,{...m,realName:t.value.trim()});
  if(f==="m-acc"&&t.value.trim()!==m.account)await put("members",id,{...m,account:t.value.trim()});
  if(f==="m-team"&&t.value!==(m.teamId||""))await put("members",id,{...m,teamId:t.value||null});
});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(!d)return;e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)importShot(f)});
document.addEventListener("paste",e=>{if(S.tab!=="input")return;const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));if(f){e.preventDefault();importShot(f)}});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("modal").hidden)closeModal()});

init();
</script>
</body>
